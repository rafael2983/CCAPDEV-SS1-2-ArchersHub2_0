<section class="greeting-row" aria-label="Page heading">
    <div class="greeting">
        <p class="greeting-sub">Academic Management</p>
        <h1>View Records</h1>
    </div>
</section>

<div class="dashboard">
    <!-- Left side: filter and filtered records -->
    <div class="dashboard-left">
        <section class="card">
            <h2>Filter</h2>
            <label for="rec-term">Term</label>
            <select id="rec-term">
                <option value="">Select Term</option>
            </select>
        </section>

        <section class="card">
            <h2>Filtered Record</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Units</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody id="rec-filtered-body">
                        <tr><td colspan="3" class="empty">Select a term to see its records.</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="enlist-actions">
                <button class="btn primary" id="rec-dl-filtered" type="button" disabled>Download filtered record</button>
            </div>
        </section>
    </div>

    <!-- Right side: all records -->
    <div class="dashboard-right">
        <section class="card">
            <h2>All Record</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Term</th>
                            <th>Course</th>
                            <th>Units</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody id="rec-all-body"></tbody>
                </table>
            </div>
            <div class="enlist-actions">
                <button class="btn primary" id="rec-dl-all" type="button">Download full record</button>
            </div>
        </section>
    </div>
</div>

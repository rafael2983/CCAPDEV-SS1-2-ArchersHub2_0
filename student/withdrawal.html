<h1 class="page-title">Course Withdrawal</h1>

<div class="withdrawal">

    <section class="card" id="wd-courses">
        <h2>Enrolled courses</h2>
        <p class="period-note" id="wd-period">Withdrawal period: not yet loaded.</p>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Course code</th>
                        <th>Course name</th>
                        <th>Section</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="wd-body">
                    <tr data-code="CBAPDEV">
                        <td>CBAPDEV</td>
                        <td>Web Application Development</td>
                        <td>XZ01</td>
                        <td><button class="row-btn drop" data-action="withdraw">Withdraw</button></td>
                    </tr>
                    <tr data-code="GEETHIC">
                        <td>GEETHIC</td>
                        <td>Ethics</td>
                        <td>XZ09</td>
                        <td><button class="row-btn drop" data-action="withdraw">Withdraw</button></td>
                    </tr>
                    <tr data-code="SAS3000">
                        <td>SAS3000</td>
                        <td>Student Affairs Services 3000</td>
                        <td>X05</td>
                        <td><button class="row-btn drop" data-action="withdraw">Withdraw</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card" id="wd-request">
        <h2>Withdrawal request</h2>

        <ul class="changes-list" id="wd-list">
            <li class="empty">No courses selected for withdrawal.</li>
        </ul>

        <label for="wd-reason">Reason</label>
        <select id="wd-reason">
            <option value="">Select a reason</option>
            <option value="load">Too heavy a load</option>
            <option value="schedule-conflict">Schedule conflict</option>
            <option value="financial">Financial reasons</option>
            <option value="personal">Personal reasons</option>
            <option value="other">Other</option>
        </select>

        <label class="policy-check" for="wd-agree">
            <input type="checkbox" id="wd-agree">
            I understand a withdrawn course will appear as W on my record
        </label>

        <div class="enlist-actions">
            <button class="btn primary" id="wd-submit" type="button" disabled>Submit withdrawal</button>
        </div>
    </section>

</div>

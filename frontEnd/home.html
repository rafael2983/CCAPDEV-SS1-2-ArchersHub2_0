<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArchersHub | Student Dashboard</title>

    <!-- (mostly) Student CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/addDrop.css">
    <link rel="stylesheet" href="css/specialClass.css">
    <link rel="stylesheet" href="css/courseWithdrawal.css">
    <link rel="stylesheet" href="css/programExchange.css">
    <link rel="stylesheet" href="css/curriculumProgression.css">
    <link rel="stylesheet" href="css/viewSchedule.css">
    <link rel="stylesheet" href="css/viewRecords.css">
    <link rel="stylesheet" href="css/enlistment.css">
    <link rel="stylesheet" href="css/universityCalendar.css">

    <!-- Faculty specific pages - CSS -->
    <link rel="stylesheet" href="css/gradeEncoding.css">
    <link rel="stylesheet" href="css/viewApplication.css">

    <!-- Admin specific pages CSS -->
    <link rel="stylesheet" href="css/accountManagement.css">
    <link rel="stylesheet" href="css/makeAnnouncements.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- =================================
             TOP NAVIGATION
        ================================== -->

        <header class="topbar">

            <!-- University Logo -->
            <div class="topbar-logo">
                <div class="university-logo">
                    <span>DLSU</span>
                </div>
            </div>


            <!-- Right-side Controls -->
            <div class="topbar-actions">

                <!-- Role Switcher -->
                <button class="role-switcher" id="roleSwitcher">
                    <span id="currentRole">STUDENT</span>
                    <span class="switch-icon">&#8635;</span>
                </button>


                <!-- Theme Toggle -->
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    &#9728;
                </button>


                <!-- Student ID -->
                <div class="student-id" id="studentID">
                    ID12345678
                </div>

            </div>

        </header>


        <!-- =================================
             MAIN APPLICATION LAYOUT
        ================================== -->

        <div class="app-layout">


            <!-- LEFT SIDEBAR -->
            <aside class="sidebar">

                <nav class="sidebar-navigation" id="sidebarNavigation">
                    <!-- Navigation generated by dashboardView.js -->
                </nav>


                <!-- Logout -->
                <div class="sidebar-bottom">

                    <button class="logout-button" id="logoutButton">
                        <span>&#10140;</span>
                        Log out
                    </button>

                </div>

            </aside>



            <!-- =================================
                 MAIN DASHBOARD CONTENT
            ================================== -->

            <main class="dashboard-main">


                <div id="pageContent"></div>


                <!-- =================================
                     FOOTER
                ================================== -->

                <footer class="dashboard-footer">

                    <span>2026 ArchersHub 2.0</span>

                    <div>
                        <a href="#">Privacy Policy</a>
                        |
                        <a href="#">Conditions</a>
                    </div>

                </footer>


            </main>

        </div>

    </div>


    <!-- HOME PAGE TEMPLATE -->
    <template id="homeTemplate">
        <div class="dashboard-content">


            <!-- Dashboard Heading -->
            <section class="dashboard-heading">

                <div>
                    <p class="welcome-text">
                        Welcome, <span id="studentName">Student Name</span>
                    </p>

                    <h1>Good Day</h1>
                </div>

                <button class="filter-button" id="filterButton">
                    Filter
                </button>

            </section>



            <!-- Dashboard Cards -->
            <div class="dashboard-grid">


                <!-- LEFT COLUMN -->
                <div class="dashboard-column">


                    <!-- Class Schedule -->
                    <section class="dashboard-card schedule-card">

                        <h2>Class Schedule</h2>

                        <div class="table-container">

                            <table class="schedule-table">

                                <thead>
                                    <tr>
                                        <th>Course</th>
                                        <th>Section</th>
                                        <th>Day / Time</th>
                                        <th>Room</th>
                                    </tr>
                                </thead>

                                <tbody id="scheduleBody">

                                    <tr>
                                        <td colspan="4" class="empty-state">
                                            No classes yet. Enlist in a course
                                            to see your schedule here
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </section>



                    <!-- School Calendar -->
                    <section class="dashboard-card calendar-card">

                        <h2>School Calendar</h2>

                        <div class="calendar-placeholder">
                            Calendar goes here
                        </div>

                    </section>


                </div>



                <!-- RIGHT COLUMN -->
                <div class="dashboard-column">


                    <!-- Events -->
                    <section class="dashboard-card events-card">

                        <h2>Events</h2>

                        <div class="empty-message">
                            No upcoming events.
                        </div>

                    </section>




                    <!-- Announcements -->
                    <section class="dashboard-card announcements-card">

                        <h2>Announcements</h2>

                        <div id="homeAnnouncementsList" aria-live="polite">

                            <div class="empty-message">
                                Loading announcements...
                            </div>

                        </div>

                    </section>




                    <!-- Other Events -->
                    <section class="dashboard-card other-events-card">

                        <h2>Other Events</h2>

                        <h3>ORGANIZATION POSTS</h3>

                        <div class="empty-message organization-message">
                            No organization posts yet.
                            Join an organization to see its updates.
                        </div>

                    </section>


                </div>

            </div>

        </div>

    </template>

    <template id="addDropTemplate">
        <div class="dashboard-content adddrop-content">

            <h1 class="page-title">Add / Drop</h1>

            <div class="adddrop-layout">

                <!-- LEFT COLUMN -->
                <section class="courses-section">

                    <!-- CAMPUS TABS -->
                    <div class="campus-tabs">
                        <button class="campus-btn active" data-campus="Laguna">Laguna</button>
                        <button class="campus-btn" data-campus="Manila">Manila</button>
                    </div>

                    <!-- SEARCH -->
                    <div class="course-controls">
                        <label for="courseSearch">Search courses</label>
                        <input type="search" id="courseSearch" placeholder="Search by course code">
                    </div>

                    <!-- SORT -->
                    <div class="course-controls">
                        <label for="courseSort">Sort courses</label>

                        <select id="courseSort">
                            <option value="code-asc">Course code (A-Z)</option>
                            <option value="code-desc">Course code (Z-A)</option>
                            <option value="name-asc">Course name (A-Z)</option>
                        </select>
                    </div>

                    <!-- COURSE TABLE -->
                    <div class="course-table-wrapper">
                        <table class="course-table">
                            <thead>
                                <tr>
                                    <th>Course code</th>
                                    <th>Course name</th>
                                    <th>Section</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="courseTableBody"></tbody>
                        </table>
                    </div>

                    <!-- SPECIAL CLASS -->
                    <div class="special-class-banner">
                        <span>Can't find the course you need?</span>
                        <button id="specialClassButton">
                            Apply Special Class
                        </button>
                    </div>

                </section>

                <!-- RIGHT COLUMN -->
                <section class="selection-section" inert aria-hidden="true">

                    <!-- CHOSEN COURSES / SCHEDULE -->
                    <div class="selection-tabs">
                        <button class="selection-btn active" data-tab="courses">
                            Chosen courses
                        </button>

                        <button class="selection-btn" data-tab="schedule">
                            Schedule
                        </button>
                    </div>

                    <div id="chosenCourses" class="chosen-courses">
                    </div>

                    <p class="enrollment-count">
                        Courses enrolled:
                        <strong id="enrollmentCount">0</strong>
                    </p>

                    <!-- CHANGES -->
                    <div class="changes-panel">
                        <h2>Changes</h2>

                        <div id="changesList" class="changes-list">
                            No changes yet. Press Add, Drop or Change on a course.
                        </div>

                        <div class="reason-group">
                            <label for="changeReason">Reason</label>
                            <select id="changeReason">
                                <option value="">Select a reason</option>
                                <option value="Schedule conflict">Schedule conflict</option>
                                <option value="Change of section">Change of section</option>
                                <option value="Change of course">Change of course</option>
                                <option value="Personal reason">Personal reason</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="reason-group">
                            <label for="otherReason">Other reason</label>
                            <textarea id="otherReason" rows="2" placeholder="Optional details"></textarea>
                        </div>
                    </div>

                    <!-- ACTIONS -->
                    <div class="submission-area">
                        <label class="policy-checkbox">
                            <input type="checkbox" id="policyAgreement">
                            <span>I agree to the school policy</span>
                        </label>

                        <div class="submission-buttons">
                            <button class="save-btn" id="saveButton">
                                Save
                            </button>

                            <button class="submit-btn" id="submitButton">
                                Submit
                            </button>
                        </div>
                    </div>

                </section>

            </div>
        </div>
    </template>

    <template id="specialClassTemplate">

        <div class="dashboard-content special-class-content">

            <h1 class="special-page-title">Apply Special Class</h1>

            <div class="special-class-layout">

                <!-- LEFT COLUMN -->
                <section class="special-left">

                    <!-- CAMPUS FILTERS -->
                    <div class="special-campus-tabs">
                        <button class="special-campus-btn active" data-campus="Either">Either</button>
                        <button class="special-campus-btn" data-campus="Laguna">Laguna</button>
                        <button class="special-campus-btn" data-campus="Manila">Manila</button>
                    </div>

                    <!-- AVAILABLE COURSES -->
                    <div class="special-card">

                        <h2>Already applied courses</h2>

                        <label for="specialSearch">
                            Search applied courses
                        </label>

                        <input type="search" id="specialSearch" placeholder="Search by course code or name">

                        <div class="special-table-wrapper">
                            <table class="special-table">
                                <thead>
                                    <tr>
                                        <th>Course code</th>
                                        <th>Course name</th>
                                        <th>Campus</th>
                                        <th>Students applied</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody id="specialCourseBody"></tbody>
                            </table>
                        </div>

                    </div>

                    <!-- NEW APPLICATION -->
                    <div class="special-card">

                        <h2>New application</h2>

                        <form id="specialApplicationForm">

                            <div class="special-form-group">
                                <label for="specialCourse">
                                    Course
                                </label>

                                <select id="specialCourse" required>
                                    <option value="">
                                        Select a course
                                    </option>
                                </select>
                            </div>

                            <div class="special-form-group">
                                <label for="specialCampus">
                                    Campus
                                </label>

                                <select id="specialCampus" required>
                                    <option value="Either">Either</option>
                                    <option value="Laguna">Laguna</option>
                                    <option value="Manila">Manila</option>
                                </select>
                            </div>

                            <div class="special-form-group">
                                <label for="specialReason">
                                    Reason
                                </label>

                                <textarea id="specialReason" rows="4" placeholder="Why do you need this special class?"
                                    required></textarea>
                            </div>

                        </form>

                    </div>

                </section>

                <!-- RIGHT COLUMN -->
                <section class="special-right">

                    <div class="special-card requested-card">

                        <h2>Currently requested courses</h2>

                        <div id="specialRequestsList" class="special-requests-list">
                            <p class="special-empty">
                                You haven't applied for any special class yet.
                            </p>
                        </div>

                        <p class="special-request-count">
                            Requests:
                            <strong id="specialRequestCount">0</strong>
                        </p>

                    </div>

                    <div class="special-actions">

                        <button type="button" id="withdrawSpecial" class="special-withdraw" disabled>
                            Withdraw application
                        </button>

                        <button type="button" id="applySpecial" class="special-apply">
                            Apply
                        </button>

                        <button type="button" id="submitSpecial" class="special-submit" disabled>
                            Submit
                        </button>

                    </div>

                </section>

            </div>

        </div>

    </template>

    <template id="courseWithdrawalTemplate">

        <div class="dashboard-content withdrawal-content">

            <h1 class="withdrawal-page-title">
                Course Withdrawal
            </h1>

            <!-- ENROLLED COURSES -->
            <section class="withdrawal-card">

                <h2>Enrolled courses</h2>

                <div class="withdrawal-notice">
                    Withdrawal period: not yet loaded.
                </div>

                <div class="withdrawal-table-wrapper">
                    <table class="withdrawal-table">

                        <thead>
                            <tr>
                                <th>Course code</th>
                                <th>Course name</th>
                                <th>Section</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="withdrawalCourseBody">
                        </tbody>

                    </table>
                </div>

            </section>

            <!-- WITHDRAWAL REQUEST -->
            <section class="withdrawal-card">

                <h2>Withdrawal request</h2>

                <div id="withdrawalSelectedCourses" class="withdrawal-selected-courses">
                    <p class="withdrawal-empty">
                        No courses selected for withdrawal.
                    </p>
                </div>

                <div class="withdrawal-form-group">
                    <label for="withdrawalReason">
                        Reason
                    </label>

                    <select id="withdrawalReason">
                        <option value="">
                            Select a reason
                        </option>

                        <option value="Academic difficulty">
                            Academic difficulty
                        </option>

                        <option value="Schedule conflict">
                            Schedule conflict
                        </option>

                        <option value="Personal reasons">
                            Personal reasons
                        </option>

                        <option value="Health reasons">
                            Health reasons
                        </option>

                        <option value="Other">
                            Other
                        </option>
                    </select>
                </div>

                <div class="withdrawal-form-group" id="withdrawalOtherGroup" hidden>

                    <label for="withdrawalOtherReason">
                        Please specify
                    </label>

                    <textarea id="withdrawalOtherReason" rows="3" placeholder="Enter your reason"></textarea>
                </div>

                <label class="withdrawal-agreement">
                    <input type="checkbox" id="withdrawalAgreement">

                    <span>
                        I understand a withdrawn course will appear
                        as W on my record
                    </span>
                </label>

                <div class="withdrawal-actions">

                    <button type="button" id="submitWithdrawal" class="withdrawal-submit" disabled>
                        Submit withdrawal
                    </button>

                </div>

            </section>

        </div>

    </template>

    <template id="programExchangeTemplate">

        <div class="dashboard-content exchange-content">

            <h1 class="exchange-page-title">
                Program Exchange
            </h1>

            <!-- APPLICATION FORM -->
            <section class="exchange-card">

                <h2>Apply for a program exchange</h2>

                <div class="exchange-notice">
                    Application period: not yet loaded.
                </div>

                <form id="exchangeApplicationForm">

                    <div class="exchange-form-group">
                        <label for="exchangeCurrentProgram">
                            Current program
                        </label>

                        <input type="text" id="exchangeCurrentProgram" value="Loading..." readonly>
                    </div>

                    <div class="exchange-form-group">
                        <label for="exchangeTargetProgram">
                            Target program
                        </label>

                        <select id="exchangeTargetProgram" required>
                            <option value="">
                                Select a program
                            </option>
                        </select>
                    </div>

                    <div class="exchange-form-group">
                        <label for="exchangeReason">
                            Reason
                        </label>

                        <textarea id="exchangeReason" rows="4" placeholder="Why do you want to change programs?"
                            required></textarea>
                    </div>

                    <div class="exchange-actions">
                        <button type="submit" id="exchangeSubmit" class="exchange-submit">
                            Submit application
                        </button>
                    </div>

                </form>

            </section>

            <!-- MY APPLICATIONS -->
            <section class="exchange-card">

                <h2>My applications</h2>

                <div class="exchange-table-wrapper">
                    <table class="exchange-table">

                        <thead>
                            <tr>
                                <th>Target program</th>
                                <th>Date applied</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="exchangeApplicationsBody">
                            <!-- JavaScript renders applications -->
                        </tbody>

                    </table>
                </div>

            </section>

        </div>

    </template>


    <template id="curriculumProgressionTemplate">

        <div class="dashboard-content curriculum-content">

            <h1 class="curriculum-page-title">
                Curriculum Progression
            </h1>

            <!-- MY PROGRESS -->
            <section class="curriculum-card">

                <h2>My progress</h2>

                <p class="curriculum-units-text">
                    Units completed:
                    <strong id="curriculumCompleted">0</strong>
                    of
                    <strong id="curriculumTotal">0</strong>
                </p>

                <div class="curriculum-progress-track" id="curriculumProgressTrack" role="progressbar"
                    aria-label="Curriculum completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

                    <div class="curriculum-progress-fill" id="curriculumProgressFill">
                    </div>

                </div>

            </section>

            <!-- COURSES -->
            <section class="curriculum-card">

                <h2>Courses</h2>

                <!-- STATUS FILTERS -->
                <div class="curriculum-filters" id="curriculumStatusFilters">

                    <button type="button" class="curriculum-filter active" data-status="All">
                        All
                    </button>

                    <button type="button" class="curriculum-filter" data-status="Taken">
                        Taken
                    </button>

                    <button type="button" class="curriculum-filter" data-status="Can take now">
                        Can take now
                    </button>

                    <button type="button" class="curriculum-filter" data-status="Needs prerequisite">
                        Needs prerequisite
                    </button>

                </div>

                <!-- COURSE TABLE -->
                <div class="curriculum-table-wrapper">

                    <table class="curriculum-table">

                        <thead>
                            <tr>
                                <th>Course code</th>
                                <th>Course name</th>
                                <th>Category</th>
                                <th>Year level</th>
                                <th>Term</th>
                                <th>Units</th>
                                <th>Prerequisite</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="curriculumCourseBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </template>

    <template id="viewScheduleTemplate">

        <div class="dashboard-content schedule-content">

            <h1 class="schedule-page-title">
                View Schedule
            </h1>

            <section class="schedule-card">

                <!-- TOP CONTROLS -->
                <div class="schedule-toolbar">

                    <div class="schedule-term-group">
                        <label for="scheduleTerm">Term</label>

                        <select id="scheduleTerm">
                            <option value="">
                                Select a term
                            </option>
                        </select>
                    </div>

                    <div class="schedule-view-toggle" id="scheduleViewToggle">

                        <button type="button" class="schedule-toggle active" data-view="weekly">
                            Weekly
                        </button>

                        <button type="button" class="schedule-toggle" data-view="list">
                            List
                        </button>

                    </div>

                </div>

                <!-- WEEKLY SCHEDULE -->
                <div id="scheduleWeeklyView" class="schedule-table-wrapper">

                    <table class="schedule-weekly-table">

                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Mon</th>
                                <th>Tue</th>
                                <th>Wed</th>
                                <th>Thu</th>
                                <th>Fri</th>
                                <th>Sat</th>
                            </tr>
                        </thead>

                        <tbody id="scheduleWeeklyBody">
                        </tbody>

                    </table>

                </div>

                <!-- LIST SCHEDULE -->
                <div id="scheduleListView" class="schedule-table-wrapper" hidden>

                    <table class="schedule-list-table">

                        <thead>
                            <tr>
                                <th>Course code</th>
                                <th>Course name</th>
                                <th>Section</th>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Room</th>
                            </tr>
                        </thead>

                        <tbody id="scheduleListBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </template>

    <template id="viewRecordsTemplate">

        <div class="dashboard-content records-content">

            <div class="records-page-heading">
                <p>Academic Management</p>
                <h1>View Records</h1>
            </div>

            <div class="records-grid">

                <!-- LEFT COLUMN -->
                <div class="records-left-column">

                    <!-- FILTER -->
                    <section class="records-card">

                        <h2>Filter</h2>

                        <label for="recordsTerm" class="records-visually-hidden">
                            Select academic term
                        </label>

                        <select id="recordsTerm">
                            <option value="">
                                Select Term
                            </option>
                        </select>

                    </section>

                    <!-- FILTERED RECORD -->
                    <section class="records-card">

                        <h2 id="filteredRecordTitle">Filtered Record</h2>

                        <div class="records-table-wrapper">

                            <table class="records-table">

                                <thead>
                                    <tr>
                                        <th>Course</th>
                                        <th>Units</th>
                                        <th>Grade</th>
                                    </tr>
                                </thead>

                                <tbody id="recordsFilteredBody">
                                </tbody>

                            </table>

                        </div>

                        <button type="button" class="records-download-btn" id="downloadFilteredRecord">
                            Download Record
                        </button>

                    </section>

                </div>

                <!-- RIGHT COLUMN -->
                <section class="records-card records-all-card">

                    <h2>All Records</h2>

                    <div class="records-table-wrapper">

                        <table class="records-table">

                            <thead>
                                <tr>
                                    <th>Term</th>
                                    <th>Course</th>
                                    <th>Units</th>
                                    <th>Grade</th>
                                </tr>
                            </thead>

                            <tbody id="recordsAllBody">
                            </tbody>

                        </table>

                    </div>

                    <button type="button" class="records-download-btn" id="downloadFullRecord">
                        Download Full record
                    </button>

                </section>

            </div>

        </div>

    </template>


    <!-- =====================================
     ENLISTMENT TEMPLATE
===================================== -->
    <template id="enlistmentTemplate">

        <div class="dashboard-content enlistment-content">

            <h1 class="enlistment-title">Enlistment</h1>

            <!-- CAMPUS SELECTION -->
            <div class="enlistment-campus-toggle">

                <button type="button" class="enlistment-campus-btn active" data-campus="Laguna">
                    Laguna
                </button>

                <button type="button" class="enlistment-campus-btn" data-campus="Manila">
                    Manila
                </button>

            </div>

            <!-- SEARCH AND SORT -->
            <div class="enlistment-filters">

                <div class="enlistment-filter-row">
                    <label for="enlistmentSearch">
                        Search courses
                    </label>

                    <input type="search" id="enlistmentSearch" placeholder="Search by course code">
                </div>

                <div class="enlistment-filter-row">
                    <label for="enlistmentSort">
                        Sort courses
                    </label>

                    <select id="enlistmentSort">
                        <option value="code-asc">
                            Course code (A-Z)
                        </option>

                        <option value="code-desc">
                            Course code (Z-A)
                        </option>

                        <option value="name-asc">
                            Course name (A-Z)
                        </option>

                        <option value="name-desc">
                            Course name (Z-A)
                        </option>
                    </select>
                </div>

            </div>

            <!-- AVAILABLE COURSES -->
            <div class="enlistment-table-wrapper">

                <table class="enlistment-table">

                    <thead>
                        <tr>
                            <th>Course code</th>
                            <th>Course name</th>
                            <th>Section</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="enlistmentCourseBody">
                    </tbody>

                </table>

            </div>

            <!-- CHOSEN COURSES / SCHEDULE -->
            <div class="enlistment-bottom-toggle">

                <button type="button" class="enlistment-view-btn active" data-view="chosen">
                    Chosen courses
                </button>

                <button type="button" class="enlistment-view-btn" data-view="schedule">
                    Schedule
                </button>

            </div>

            <!-- CHOSEN COURSES VIEW -->
            <section id="enlistmentChosenView">

                <div id="enlistmentChosenList" class="enlistment-chosen-list">
                </div>

            </section>

            <!-- SCHEDULE VIEW -->
            <section id="enlistmentScheduleView" hidden>

                <div class="enlistment-table-wrapper">

                    <table class="enlistment-table">

                        <thead>
                            <tr>
                                <th>Course</th>
                                <th>Section</th>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Room</th>
                            </tr>
                        </thead>

                        <tbody id="enlistmentScheduleBody">
                        </tbody>

                    </table>

                </div>

            </section>

            <!-- COURSE COUNT -->
            <p class="enlistment-course-count">
                Courses chosen:
                <strong id="enlistmentCount">0</strong>
            </p>

            <!-- FOOTER ACTIONS -->
            <div class="enlistment-actions">

                <label class="enlistment-policy">
                    <input type="checkbox" id="enlistmentPolicy">

                    I agree to the school policy
                </label>

                <div class="enlistment-action-buttons">

                    <button type="button" id="enlistmentSave" class="enlistment-save-btn">
                        Save
                    </button>

                    <button type="button" id="enlistmentSubmit" class="enlistment-submit-btn" disabled>
                        Submit
                    </button>

                </div>

            </div>

            <p id="enlistmentMessage" class="enlistment-message" role="status" aria-live="polite"></p>

        </div>

    </template>


    <!-- =====================================
     UNIVERSITY CALENDAR TEMPLATE
===================================== -->
    <template id="universityCalendarTemplate">

        <div class="dashboard-content university-calendar-content">

            <h1 class="university-calendar-title">
                University Calendar
            </h1>

            <section class="university-calendar-card">

                <!-- VIEW TOGGLE -->
                <div class="university-calendar-toggle" id="universityCalendarToggle">

                    <button type="button" class="university-calendar-toggle-btn active" data-view="tabular"
                        aria-pressed="true">
                        Tabular
                    </button>

                    <button type="button" class="university-calendar-toggle-btn" data-view="list" aria-pressed="false">
                        List
                    </button>

                </div>

                <!-- TABULAR VIEW -->
                <div id="universityCalendarTabularView" class="university-calendar-table-wrapper">

                    <table class="university-calendar-table">

                        <thead>
                            <tr>
                                <th>Start date</th>
                                <th>End date</th>
                                <th>Event</th>
                                <th>Important</th>
                            </tr>
                        </thead>

                        <tbody id="universityCalendarTableBody">
                        </tbody>

                    </table>

                </div>

                <!-- LIST VIEW -->
                <div id="universityCalendarListView" hidden>

                    <div id="universityCalendarList" class="university-calendar-list">
                    </div>

                </div>

            </section>

        </div>

    </template>







    <!-- =========================================
     FACULTY - GRADE ENCODING
========================================= -->
    <template id="gradeEncodingTemplate">

        <div class="dashboard-content grade-encoding-page">

            <h1 class="grade-encoding-title">
                Grade Encoding
            </h1>

            <section class="grade-encoding-card">

                <!-- COURSE AND SECTION -->
                <div class="grade-encoding-filters">

                    <div class="grade-encoding-field">
                        <label for="gradeCourse">
                            Course
                        </label>

                        <select id="gradeCourse">
                            <option value="">
                                -- Select course --
                            </option>
                        </select>
                    </div>

                    <div class="grade-encoding-field">
                        <label for="gradeSection">
                            Section
                        </label>

                        <select id="gradeSection" disabled>
                            <option value="">
                                Select a course first
                            </option>
                        </select>
                    </div>

                </div>

                <!-- STATUS -->
                <div class="grade-encoding-status-row">
                    <p id="gradeEncodingMessage">
                        Select a course and section to view students.
                    </p>

                    <span id="gradeEncodingUnsaved" class="grade-encoding-unsaved" hidden>
                        Unsaved changes
                    </span>
                </div>

                <!-- STUDENT TABLE -->
                <div class="grade-encoding-table-wrapper">

                    <table class="grade-encoding-table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Student Name</th>
                                <th>Grade</th>
                            </tr>
                        </thead>

                        <tbody id="gradeEncodingTableBody">
                            <tr>
                                <td colspan="3">
                                    Select a course and section first.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <!-- SAVE -->
                <div class="grade-encoding-actions">

                    <button type="button" id="gradeEncodingSave" class="grade-encoding-save" disabled>
                        Save
                    </button>

                </div>

            </section>

        </div>

    </template>


    <!-- =========================================
     FACULTY - VIEW APPLICATION
========================================= -->
    <template id="viewApplicationTemplate">

        <div class="dashboard-content view-application-page">

            <div class="application-heading">
                <p>Enrollment Hub</p>
                <h1>View the Application</h1>
            </div>

            <div class="application-layout">

                <!-- LEFT: COURSE LIST -->
                <section class="application-card application-courses">

                    <h2>List of Course</h2>

                    <div class="application-list">
                        <div class="application-list-header">
                            Course Code
                        </div>

                        <div id="applicationCourseList"></div>
                    </div>

                </section>


                <!-- MIDDLE: SECTION LIST -->
                <section class="application-card application-sections">

                    <h2>Section</h2>

                    <div class="application-list">
                        <div class="application-list-header">
                            Sec
                        </div>

                        <div id="applicationSectionList"></div>
                    </div>

                </section>


                <!-- RIGHT: SELECTED COURSE -->
                <section class="application-card application-selected">

                    <h3>Selected Course &amp; Section</h3>

                    <p id="applicationSelectedCourse">
                        Select a course and section
                    </p>

                </section>


                <!-- LEFT BOTTOM: ADD/DROP -->
                <section class="application-card application-actions">

                    <form id="applicationUpdateForm">

                        <div class="application-form-field">
                            <label for="applicationStudentID">
                                ID Number
                            </label>

                            <input type="text" id="applicationStudentID" placeholder="Enter ID (e.g. 12345678)"
                                inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required>
                        </div>

                        <div class="application-form-field">
                            <label for="applicationStatus">
                                Status
                            </label>

                            <select id="applicationStatus">
                                <option value="Enlisted">Enlist</option>
                                <option value="Pending">Pending</option>
                                <option value="None">Drop</option>
                            </select>
                        </div>

                        <button type="submit" class="application-submit">
                            Add / Drop
                        </button>

                    </form>

                    <p id="applicationFeedback" class="application-feedback" role="status" aria-live="polite"></p>

                </section>


                <!-- RIGHT BOTTOM: STUDENT TABLE -->
                <section class="application-card application-students">

                    <h2>
                        List of Student Enlisted in Selected
                        Course and Section
                    </h2>

                    <div class="application-table-wrapper">

                        <table class="application-table">

                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Student Name</th>
                                    <th>Degree Program</th>
                                    <th>Status</th>
                                </tr>
                            </thead>

                            <tbody id="applicationStudentTable"></tbody>

                        </table>

                    </div>

                </section>

            </div>

        </div>

    </template>


    <!-- =========================================
     ADMIN - ACCOUNT MANAGEMENT
========================================= -->
    <template id="accountManagementTemplate">

        <section class="dashboard-content account-management-page">

            <h1 class="page-title">Account Management</h1>

            <div class="account-management-layout">

                <!-- LEFT: EXISTING ACCOUNTS -->
                <div class="account-panel account-list-panel">

                    <div class="account-panel-header">
                        <div>
                            <h2>List of Existing ID</h2>
                            <p>Select an account to view its records.</p>
                        </div>

                        <span class="account-count" id="accountCount">
                            0 accounts
                        </span>
                    </div>

                    <div class="account-list" id="accountList">
                        <!-- Rendered by JavaScript -->
                    </div>

                    <div class="account-panel-footer">
                        <button type="button" class="account-secondary-button" data-record="Enlistment">
                            Enlistment
                        </button>

                        <button type="button" class="account-secondary-button" data-record="Grade">
                            Grade
                        </button>

                        <button type="button" class="account-secondary-button" data-record="Other">
                            Other
                        </button>
                    </div>

                </div>


                <!-- RIGHT: ACCOUNT FORM -->
                <div class="account-panel account-form-panel">

                    <div class="account-panel-header">
                        <h2>Basic Information</h2>

                        <div class="account-form-heading-actions">
                            <span class="account-required-note">
                                <span>*</span> Required
                            </span>

                            <button type="button" id="newAccountButton" class="account-new-button">
                                New account
                            </button>
                        </div>
                    </div>

                    <form id="accountManagementForm">

                        <div class="account-form-body">

                            <div class="account-field">
                                <label for="accountID">
                                    ID <span>*</span>
                                </label>

                                <input type="text" id="accountID" placeholder="e.g. 12208469" inputmode="numeric"
                                    pattern="[0-9]{8}" maxlength="8" required>
                            </div>

                            <div class="account-field">
                                <label>Name <span>*</span></label>

                                <div class="account-name-grid">

                                    <div>
                                        <label for="accountSurname">
                                            Surname
                                        </label>
                                        <input type="text" id="accountSurname" placeholder="Surname" required>
                                    </div>

                                    <div>
                                        <label for="accountMiddleName">
                                            Middle Name
                                        </label>
                                        <input type="text" id="accountMiddleName" placeholder="Middle name">
                                    </div>

                                    <div>
                                        <label for="accountFirstName">
                                            First Name
                                        </label>
                                        <input type="text" id="accountFirstName" placeholder="First name" required>
                                    </div>

                                </div>
                            </div>

                            <div class="account-field">
                                <label for="accountEmail">
                                    Email <span>*</span>
                                </label>

                                <input type="email" id="accountEmail" placeholder="name@example.edu" required>
                            </div>

                            <div class="account-select-grid">

                                <div class="account-field">
                                    <label for="accountType">
                                        Account Type <span>*</span>
                                    </label>

                                    <select id="accountType" required>
                                        <option value="">Select type</option>
                                        <option value="Student">Student</option>
                                        <option value="Faculty">Faculty</option>
                                        <option value="Admin">Admin</option>
                                    </select>
                                </div>

                                <div class="account-field">
                                    <label for="accountStatus">
                                        Account Status <span>*</span>
                                    </label>

                                    <select id="accountStatus" required>
                                        <option value="">Select status</option>
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>

                            </div>

                            <p id="accountFormMessage" class="account-form-message" role="status" aria-live="polite">
                            </p>

                        </div>

                        <div class="form-group" id="accountPasswordGroup">
                            <label for="accountPassword">
                                Initial Password
                            </label>

                            <input type="password" id="accountPassword" name="accountPassword"
                                autocomplete="new-password" minlength="12" maxlength="128"
                                placeholder="At least 12 characters">
                        </div>

                        <div class="account-form-footer">
                            <button type="submit" id="accountSubmitButton" class="account-primary-button">
                                Create
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </section>

    </template>


    <!-- =========================================
     ADMIN - MAKE ANNOUNCEMENTS
========================================= -->

    <template id="makeAnnouncementsTemplate">

        <section class="dashboard-content announcements-page">

            <div class="announcements-heading">
                <p>Administration Portal</p>
                <h1 class="page-title">Make Announcements</h1>
                <p class="announcement-required-note">
                    <span class="announcement-required">*</span>
                    Required fields when publishing an announcement.
                </p>
            </div>

            <form id="announcementForm">

                <div class="announcements-layout">

                    <!-- LEFT COLUMN -->
                    <div class="announcements-left">

                        <!-- TITLE -->
                        <div class="announcement-card">

                            <h2>
                                <label for="announcementTitle">
                                    Title
                                    <span class="announcement-required">*</span>
                                </label>
                            </h2>

                            <input type="text" id="announcementTitle" placeholder="Announcement Title..."
                                maxlength="150" required>

                            <label class="announcement-important">

                                <input type="checkbox" id="announcementImportant">

                                <span>For important announcement</span>

                            </label>

                        </div>


                        <!-- ATTACHMENTS -->
                        <div class="announcement-card">

                            <div class="announcement-card-heading">
                                <h2>Uploaded file list</h2>

                                <button type="button" id="addAnnouncementFiles" class="announcement-add-file">
                                    + Add files
                                </button>
                            </div>

                            <input type="file" id="announcementFiles" multiple hidden>

                            <div class="announcement-file-list" id="announcementFileList">
                                No files attached yet.
                            </div>

                        </div>


                        <!-- DATES -->
                        <div class="announcement-card">

                            <div class="announcement-date-grid">

                                <div class="announcement-field">

                                    <label for="announcementStartDate">
                                        START DATE
                                        <span class="announcement-required">*</span>
                                    </label>

                                    <input type="date" id="announcementStartDate" required>

                                </div>

                                <div class="announcement-field">

                                    <label for="announcementEndDate">
                                        END DATE
                                        <span class="announcement-required">*</span>
                                    </label>

                                    <input type="date" id="announcementEndDate" required>

                                </div>

                            </div>

                        </div>


                        <!-- ACTION BUTTONS -->
                        <div class="announcement-actions">

                            <button type="button" id="saveAnnouncement" class="announcement-save-button">
                                Save Draft
                            </button>

                            <button type="submit" class="announcement-upload-button">
                                Publish Announcement
                            </button>

                        </div>

                        <p id="announcementMessage" class="announcement-message" role="status" aria-live="polite"></p>

                    </div>


                    <!-- RIGHT COLUMN -->
                    <div class="announcement-card announcement-content-card">

                        <h2>
                            <label for="announcementContents">
                                Contents
                                <span class="announcement-required">*</span>
                            </label>
                        </h2>

                        <textarea id="announcementContents" placeholder="Type announcement contents here..."
                            required></textarea>

                    </div>

                </div>

            </form>


            <!-- =====================================
     ANNOUNCEMENT MANAGEMENT
===================================== -->

            <section class="announcement-management">

                <div class="announcement-management-heading">
                    <h2>Manage Announcements</h2>

                    <button type="button" id="refreshAnnouncements" class="announcement-save-button">
                        Refresh
                    </button>
                </div>

                <p id="managementMessage" role="status" aria-live="polite"></p>

                <div id="announcementManagementList">
                    Loading announcements...
                </div>

            </section>


        </section>

    </template>


    <!-- Dashboard JavaScript -->
    <script type="module" src="js/dashboardMain.js"></script>

</body>

</html>

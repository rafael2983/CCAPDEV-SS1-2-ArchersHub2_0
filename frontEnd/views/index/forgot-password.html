<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>
    <script src="../../scripts/index.js"></script>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/index.css">
</head>

<body>
    <main class="forgot-pwd-page">
        <form class="forgot-pwd-form">
            <div class="forgot-pwd-container">
                <!-- SCHOOL LOGO -->
                <div class="logo-container">
                    <img src="../images/school-logo.png" alt="School Logo" class="school-logo">
                </div>
                
                <!-- Gmail -->
                <div class="input-group">
                    <label for="gmail">Gmail</label>
                    <input type="text" id="gmail" name="gmail" placeholder="Gmail">
                </div>

                <button type="submit" class="forgot-pwd-submit">Submit</button>
                <a href="../../index.html" class="back-to-login"> Back to Login</a>
            </div>
        </form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>
    <script src="scripts/scripts.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="forgot-pwd-header">
        <img src="images/school-logo.png" alt="school-logo" class="forgot-pwd-logo">
    </div>

    </div>
    <main class="forgot-pwd-page">
        <form class="forgot-pwd-form">
            <div class="forgot-pwd-container">
                    <!-- ID -->
                    <div class="input-group">
                        <label for="student-id">ID</label>

                        <input 
                            type="text"
                            id="student-id"
                            name="student-id"
                            placeholder="Enter your ID"
                        >
                    </div>
                    <!-- First Name -->
                    <div class="input-group">
                        <label for="fname">First Name</label>

                        <input 
                            type="text"
                            id="fname"
                            name="fname"
                            placeholder="First Name"
                        >
                    </div>
                    <!-- Last Name -->
                    <div class="input-group">
                        <label for="lname">Last Name</label>

                        <input 
                            type="text"
                            id="lname"
                            name="lname"
                            placeholder="Last Name"
                        >
                    </div>
                    <!-- Gmail -->
                    <div class="input-group">
                        <label for="gmail">Gmail</label>

                        <input 
                            type="text"
                            id="gmail"
                            name="gmail"
                            placeholder="Gmail"
                        >
                    </div>
                    <!-- OTP -->
                    <div class="input-group">
                        <label for="otp">OTP</label>

                        <input 
                            type="text"
                            id="otp"
                            name="otp"
                            placeholder="OTP"
                        >
                    </div>

                    <button type="submit" class="forgot-pwd-submit">Submit</button>
                    <button type="button" class="back-to-login">Back to Login</button>
            </div>
        </form>
    </main>
</body>
</html>

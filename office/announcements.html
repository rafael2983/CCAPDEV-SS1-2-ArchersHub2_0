<section class="greeting-row" aria-label="Greeting">
    <div class="greeting">
        <p class="greeting-sub">Faculty Portal</p>
        <h1>Make Announcements</h1>
    </div>
</section>

<div class="dashboard">
    <!-- Left Side Controls -->
    <div class="dashboard-left">
        <!-- Title & Checkbox -->
        <section class="card">
            <h2>Title</h2>
            <div style="margin-top: 10px;">
                <input type="text" placeholder="Announcement Title..."
                    style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 10px;">
                <label
                    style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer;">
                    <input type="checkbox"> For important announcement
                </label>
            </div>
        </section>

        <!-- Uploaded File List -->
        <section class="card">
            <h2>Uploaded file list</h2>
            <div
                style="padding: 15px; background: rgba(0,0,0,0.02); border: 1px dashed #ccc; border-radius: 6px; text-align: center; color: #666; font-size: 0.9rem;">
                No files attached yet.
            </div>
        </section>

        <!-- Calendars side by side -->
        <section class="card">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <h3 style="font-size: 0.95rem; margin-bottom: 5px;">Start Date</h3>
                    <input type="date"
                        style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                </div>
                <div style="flex: 1;">
                    <h3 style="font-size: 0.95rem; margin-bottom: 5px;">End Date</h3>
                    <input type="date"
                        style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                </div>
            </div>
        </section>

        <!-- Action Buttons -->
        <div style="display: flex; gap: 10px;">
            <button class="filter-btn"
                style="flex: 1; background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; justify-content: center;">Save</button>
            <button class="filter-btn"
                style="flex: 1; background-color: #004d26; color: white; justify-content: center;">Upload</button>
        </div>
    </div>

    <!-- Right Side: Contents -->
    <div class="dashboard-right">
        <section class="card" style="height: 100%; display: flex; flex-direction: column;">
            <h2>Contents</h2>
            <div style="flex: 1; margin-top: 10px; display: flex; flex-direction: column;">
                <textarea placeholder="Type announcement contents here..."
                    style="width: 100%; flex: 1; min-height: 380px; padding: 12px; border-radius: 6px; border: 1px solid #ccc; resize: vertical; font-family: inherit;"></textarea>
            </div>
        </section>
    </div>
</div>

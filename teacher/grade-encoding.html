<h1 class="page-title">Grade Encoding</h1>

<div class="grade-encoding">
    <section class="card" id="grade-encoding">

        <!-- Course and Section selection -->
        <div class="grade-selection">
            <div class="grade-field">
                <label for="course-select">Course</label>
                <select id="course-select">
                    <option value="">Loading courses...</option>
                </select>
            </div>

            <div class="grade-field">
                <label for="section-select">Section</label>
                <select id="section-select" disabled>
                    <option value="">Select a course first</option>
                </select>
            </div>

        </div>

        <p id="grade-status" role="status">Select a course and section to view students.</p>

        <!-- Student list -->
        <div class="table-wrap">
            <table class="grade-table">
                <colgroup>
                    <col style="width: 20%;">
                    <col style="width: 60%;">
                    <col style="width: 20%;">
                </colgroup>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student Name</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="grade-students-body">
                    <tr>
                        <td colspan="3">Select a course and section first.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="grade-actions">
            <button type="button" id="save-grades-btn" disabled>Save</button>
        </div>
    </section>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <!-- LEFT SIDE -->
        <section class="school-section">

            <img 
                src="images/school-picture.png" 
                alt="School"
                class="school-image"
            >

            
        </section>


        <!-- RIGHT SIDE -->
        <section class="login-section">

            <div class="login-container">

                <!-- SCHOOL LOGO -->
                <div class="logo-container">
                    <img 
                        src="images/school-logo.png" 
                        alt="School Logo"
                        class="school-logo"
                    >
                </div>


                <!-- EMPTY / BANNER AREA -->
                <div class="banner-area">
                    <!-- You can put announcements or other content here later -->
                </div>


                <!-- LOGIN FORM -->
                <form class="login-form">

                    <!-- ID -->
                    <div class="input-group">
                        <label for="student-id">ID</label>

                        <input 
                            type="text"
                            id="student-id"
                            name="student-id"
                            placeholder="Enter your ID"
                        >
                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">
                        <label for="password">Password</label>

                        <input 
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                        >
                    </div>


                    <!-- CLOUDFLARE -->
                    <div class="cloudflare">
                        CLOUDFLARE
                    </div>


                    <!-- LOGIN BUTTONS -->
                    <div class="button-row">

                        <button 
                            type="button" 
                            class="secondary-button"
                        >
                            Forgot Password
                        </button>

                        <button 
                            type="submit" 
                            class="login-button"
                        >
                            Login
                        </button>

                    </div>


                    <!-- GOOGLE LOGIN -->
                    <button 
                        type="button" 
                        class="google-button"
                    >
                        Google Login
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
